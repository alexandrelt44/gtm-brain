<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF; --panel: #F7F6F3; --card: #EFEDE8; --line: #E6E3DD; --line-2: #D6D2CA;
  --text: #24142A; --text-2: #4A3F50; --muted: #7A7180; --faint: #A39BA8;
  --accent: #7C3AED; --accent-soft: #F1EAFE; --accent-line: #DCCBFB;
  --pink: #DB2777; --teal: #0F766E; --rose: #DC2626;
  --sans: Outfit, ui-sans-serif, system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); overflow: hidden; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 290px 1fr auto; grid-template-rows: 100vh; height: 100vh; }

/* sidebar */
aside.side { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.brand { padding: 16px 16px 10px; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
.brand h1 b { background: linear-gradient(90deg, var(--accent), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand .sub { color: var(--muted); font: 11px var(--mono); margin-top: 4px; }
.search { margin: 4px 12px 8px; position: relative; }
.search input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 8px 10px 8px 30px; font: 13px var(--sans); outline: none; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 9px; top: 9px; opacity: .5; }
.search kbd { position: absolute; right: 8px; top: 7px; font: 10px var(--mono); color: var(--faint); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; }
.tree { overflow-y: auto; flex: 1; padding: 0 6px 16px; }
.grp { margin-top: 10px; }
.grp > .gh { display: flex; align-items: center; gap: 6px; padding: 4px 8px; font: 500 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); cursor: pointer; user-select: none; }
.grp > .gh .n { margin-left: auto; }
.grp.closed > .items { display: none; }
.row { display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-radius: 6px; cursor: pointer; color: var(--text-2); white-space: nowrap; overflow: hidden; }
.row:hover { background: var(--card); }
.row.sel { background: var(--accent-soft); color: var(--text); }
.row .t { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.row .m { font: 10px var(--mono); color: var(--faint); }
.row.indent { padding-left: 24px; }
.row.dim { color: var(--faint); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.hollow { background: var(--bg) !important; border: 1.5px dashed; }
.foot { border-top: 1px solid var(--line); padding: 8px 14px; font: 10px var(--mono); color: var(--faint); }

/* main */
main { position: relative; min-width: 0; height: 100vh; overflow: hidden; }
#graph { position: absolute; inset: 0; }
.bar { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; z-index: 2; }
.bar > * { pointer-events: auto; }
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 5px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.lbl { font: 10px var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: .08em; margin: 0 2px 0 6px; }
.chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px 3px 7px; font-size: 11.5px; color: var(--muted); cursor: pointer; }
.chip.off { opacity: .4; text-decoration: line-through; }
.chip .sw { width: 14px; height: 3px; border-radius: 2px; }
.chip .sw.dash { background: repeating-linear-gradient(90deg, currentColor 0 3px, transparent 3px 6px) !important; }
.legend { position: absolute; left: 12px; bottom: 12px; background: color-mix(in srgb, var(--bg) 92%, transparent); box-shadow: 0 1px 3px rgba(36,20,42,.06); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: grid; grid-template-columns: repeat(2, auto); gap: 3px 14px; font-size: 11.5px; z-index: 2; }
.legend .li { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--muted); }
.legend .li.off { opacity: .35; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; z-index: 2; }
.zoom button { background: none; border: 0; width: 30px; height: 28px; cursor: pointer; color: var(--muted); font-size: 15px; }
.zoom button:hover { background: var(--panel); color: var(--text); }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--text); color: var(--bg) !important; border: 1px solid var(--line-2); border-radius: 999px; padding: 5px 14px; font-size: 12px; color: var(--muted); z-index: 2; }

/* detail panel */
aside.detail { width: 0; overflow: hidden; border-left: 1px solid var(--line); background: var(--bg); transition: width .18s ease; }
aside.detail.open { width: 400px; }
.dwrap { width: 400px; height: 100vh; overflow-y: auto; padding: 16px 18px 40px; }
.crumb { display: flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--faint); }
.crumb button { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
.dtitle { font-size: 20px; font-weight: 600; margin: 10px 0 4px; line-height: 1.25; }
.dsub { color: var(--muted); font-size: 12.5px; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 3px 10px; margin: 12px 0; font-size: 12.5px; }
.kv dt { color: var(--faint); font: 11px var(--mono); padding-top: 2px; }
.kv dd { margin: 0; word-break: break-word; }
.pill { display: inline-block; font: 10.5px var(--mono); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); margin: 0 4px 4px 0; }
.pill.ok { color: var(--teal); border-color: #A7DCD5; background: #EEF9F7; }
.pill.warn { color: var(--pink); border-color: #F5C2D9; background: #FDF2F7; }
.pill.bad { color: var(--rose); border-color: #F7C0C0; background: #FEF2F2; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 4px; }
.acts a, .acts button { font-size: 12px; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: 6px; padding: 4px 9px; text-decoration: none; cursor: pointer; }
.excerpt { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--text-2); font-size: 12.5px; white-space: pre-wrap; max-height: 220px; overflow-y: auto; margin: 10px 0 4px; }
.cgrp { margin-top: 14px; }
.cgrp h4 { margin: 0 0 4px; font: 500 10.5px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--faint); display: flex; gap: 6px; align-items: center; }
.crow { padding: 4px 6px; border-radius: 6px; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: start; }
.crow:hover { background: var(--panel); }
.crow .dot { margin-top: 5px; }
.crow .ct { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; }
.crow .ev { grid-column: 2 / 4; font-size: 11px; color: var(--faint); margin-top: 1px; line-height: 1.35; }
.crow .w { font: 10px var(--mono); color: var(--faint); }
.empty { color: var(--faint); font-size: 12px; padding: 4px 6px; }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  aside.side { display: none; }
  aside.detail.open { position: fixed; inset: 0; width: 100%; z-index: 5; }
  .dwrap { width: 100%; }
  .legend { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>GTM <b>Brain</b></h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Buscar no GTM Brain…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <div class="tree" id="tree"></div>
    <div class="foot" id="foot"></div>
  </aside>

  <main>
    <div id="graph"></div>
    <div class="bar">
      <div class="seg" id="mode">
        <button data-v="files">Arquivos</button><button data-v="entities">Entidades</button><button data-v="sections">Seções</button>
      </div>
      <span class="lbl">Lente</span>
      <div class="seg" id="lens">
        <button data-v="none">—</button><button data-v="pending">Pendências</button><button data-v="tension">Tensões</button><button data-v="proof">Prova</button><button data-v="sources">Fontes</button>
      </div>
      <span class="lbl">Arestas</span>
      <div class="chips" id="echips"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="zoom">
      <button id="zin" title="Aproximar">+</button><button id="zout" title="Afastar">−</button><button id="zfit" title="Enquadrar">⤢</button><button id="zre" title="Reorganizar (solta os nós fixados)">↻</button>
    </div>
    <div class="toast" id="toast" hidden></div>
  </main>

  <aside class="detail" id="detail"><div class="dwrap" id="dwrap"></div></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/force-graph@1.49.6/dist/force-graph.min.js"></script>
<script>
const GRAPH = /*__GRAPH__*/null;

// ---------------------------------------------------------------- vocabulary
// Every node is a circle; type is told by color and size.
const NT = {
  layer:       { label: 'Camada',       color: '#2A1631', r: 7 },
  file:        { label: 'Arquivo',      color: '#7C3AED', r: 5 },
  intro:       { label: 'Intro',        color: '#BDB6C3', r: 2 },
  section:     { label: 'Seção H2',     color: '#BDB6C3', r: 2.5 },
  persona:     { label: 'Persona',      color: '#DB2777', r: 5 },
  offer:       { label: 'Oferta',       color: '#2563EB', r: 5 },
  deal:        { label: 'Deal',         color: '#8B5CF6', r: 4 },
  alternative: { label: 'Alternativa',  color: '#EA580C', r: 4 },
  proof:       { label: 'Prova (ID)',   color: '#0D9488', r: 3.5 },
  source:      { label: 'Fonte',        color: '#CA8A04', r: 4.5 },
  issue:       { label: 'Issue Linear', color: '#94A3B8', r: 2.5 },
  note:        { label: 'Nota Obsidian',color: '#0EA5E9', r: 3.5 },
};
const TEMPLATE_COLOR = '#B4ACBA';
const UNDEFINED_PROOF = '#DB2777';
const ET = {
  contains: { label: 'contém',          color: 'rgba(42,22,49,.10)' },
  cites:    { label: 'cita',            color: 'rgba(124,58,237,.40)' },
  loads:    { label: 'load order',      color: 'rgba(42,22,49,.60)', arrow: true },
  proves:   { label: 'prova',           color: 'rgba(13,148,136,.50)' },
  defines:  { label: 'define',          color: 'rgba(13,148,136,.30)' },
  mentions: { label: 'menciona',        color: 'rgba(13,148,136,.30)', dash: [2, 3] },
  derives:  { label: 'deriva de',       color: 'rgba(202,138,4,.30)' },
  tracks:   { label: 'issue',           color: 'rgba(100,116,139,.25)' },
  pending:  { label: 'pendente',        color: 'rgba(219,39,119,.75)', dash: [4, 3] },
  tension:  { label: 'tensão',          color: 'rgba(220,38,38,.90)', width: 2 },
  links:    { label: 'wikilink',        color: 'rgba(14,165,233,.22)' },
  resolves: { label: 'fonte → nota',    color: 'rgba(14,165,233,.75)', dash: [5, 3], width: 1.6 },
};
const SECTIONISH = new Set(['intro', 'section', 'persona', 'offer', 'deal', 'alternative']);
const TYPED = new Set(['persona', 'offer', 'deal', 'alternative']);
const STATUS_LABEL = { filled: 'preenchido', template: 'template', kit: 'kit upstream', meta: 'meta' };

// ---------------------------------------------------------------- state
const byId = new Map(GRAPH.nodes.map((n) => [n.id, n]));
const hasVault = GRAPH.nodes.some((n) => n.type === 'note');
const st = {
  mode: 'entities',
  lens: 'none',
  hiddenTypes: new Set(['intro', 'section']),
  hiddenEdges: new Set(['tracks']),
  selected: null,
  hover: null,
  q: '',
};
try { const saved = JSON.parse(localStorage.getItem('gtm-brain-ui-v1') || 'null'); if (saved) { st.mode = saved.mode || st.mode; st.hiddenTypes = new Set(saved.hiddenTypes || [...st.hiddenTypes]); st.hiddenEdges = new Set(saved.hiddenEdges || [...st.hiddenEdges]); } } catch (e) {}
const persist = () => { try { localStorage.setItem('gtm-brain-ui-v1', JSON.stringify({ mode: st.mode, hiddenTypes: [...st.hiddenTypes], hiddenEdges: [...st.hiddenEdges] })); } catch (e) {} };

// ---------------------------------------------------------------- view model
const nodeObj = new Map(); // stable objects so positions survive refilters
function parentOf(n) {
  if (!SECTIONISH.has(n.type)) return n.id;
  if (st.mode === 'sections') return n.id;
  if (st.mode === 'entities' && TYPED.has(n.type)) return n.id;
  return 'file:' + n.path;
}
let view = { nodes: [], links: [] };
let adj = new Map();
function buildView() {
  const map = new Map();
  for (const n of GRAPH.nodes) map.set(n.id, parentOf(n));
  const visible = new Set();
  for (const n of GRAPH.nodes) {
    const p = byId.get(map.get(n.id));
    // In collapsed modes sections fold into their file, so filters apply to the representative.
    if (!p || st.hiddenTypes.has(p.type)) continue;
    visible.add(p.id);
  }
  const agg = new Map();
  for (const e of GRAPH.edges) {
    if (st.hiddenEdges.has(e.type)) continue;
    const s = map.get(e.source), t = map.get(e.target);
    if (!s || !t || s === t || !visible.has(s) || !visible.has(t)) continue;
    const key = s + '|' + t + '|' + e.type;
    let a = agg.get(key);
    if (!a) agg.set(key, (a = { source: s, target: t, type: e.type, weight: 0, evidence: [], step: e.step }));
    a.weight += e.weight;
    for (const ev of e.evidence || []) if (a.evidence.length < 4) a.evidence.push(ev);
  }
  const links = [...agg.values()];
  const deg = new Map();
  for (const l of links) { deg.set(l.source, (deg.get(l.source) || 0) + 1); deg.set(l.target, (deg.get(l.target) || 0) + 1); }
  const nodes = [];
  for (const id of visible) {
    const n = byId.get(id);
    // Drop isolated leaves (issues, sections) but keep the skeleton.
    if (!deg.get(id) && !['layer', 'file', 'persona', 'offer', 'source', 'proof'].includes(n.type)) continue;
    let o = nodeObj.get(id);
    if (!o) { o = { id }; nodeObj.set(id, o); }
    o.n = n; o.deg = deg.get(id) || 0;
    nodes.push(o);
  }
  const ids = new Set(nodes.map((o) => o.id));
  view = { nodes, links: links.filter((l) => ids.has(l.source) && ids.has(l.target)) };
  adj = new Map();
  for (const l of view.links) {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    (adj.get(s) || adj.set(s, new Set()).get(s)).add(t);
    (adj.get(t) || adj.set(t, new Set()).get(t)).add(s);
  }
}

// ---------------------------------------------------------------- lenses
function lensLink(l) {
  switch (st.lens) {
    case 'pending': return l.type === 'pending';
    case 'tension': return l.type === 'tension';
    case 'proof': return ['proves', 'defines', 'mentions'].includes(l.type);
    case 'sources': return ['derives', 'resolves'].includes(l.type);
    default: return true;
  }
}
function lensNode(o) {
  if (st.lens === 'none') return true;
  const n = o.n;
  if (st.lens === 'pending' && (n.status === 'template' || n.drift || (n.type === 'proof' && !n.defined))) return true;
  if (st.lens === 'tension' && n.drift) return true;
  if (st.lens === 'proof' && n.type === 'proof') return true;
  if (st.lens === 'sources' && (n.type === 'source' || (n.type === 'note' && n.hop === 0))) return true;
  return lensTouched.has(o.id);
}
let lensTouched = new Set();
function computeLens() {
  lensTouched = new Set();
  if (st.lens === 'none') return;
  for (const l of view.links) if (lensLink(l)) { lensTouched.add(idOf(l.source)); lensTouched.add(idOf(l.target)); }
}
const idOf = (x) => (typeof x === 'object' ? x.id : x);

// ---------------------------------------------------------------- graph
const el = document.getElementById('graph');
const fg = new ForceGraph(el)
  .backgroundColor('#FFFFFF')
  .nodeId('id')
  .nodeVal((o) => radius(o))
  .nodeLabel(() => '')
  .linkSource('source').linkTarget('target')
  .linkColor((l) => linkColor(l))
  .linkWidth((l) => (ET[l.type].width || 1) * (isFocusLink(l) ? 1.8 : 1) * Math.min(2.2, 0.7 + Math.log2(1 + l.weight) * 0.35))
  .linkLineDash((l) => ET[l.type].dash || null)
  .linkDirectionalArrowLength((l) => (ET[l.type].arrow || l.type === 'pending' || l.type === 'tension' ? 3.5 : 0))
  .linkDirectionalArrowRelPos(1)
  .linkDirectionalParticles((l) => (isFocusLink(l) && ['proves', 'cites', 'derives', 'resolves', 'pending'].includes(l.type) ? 2 : 0))
  .linkDirectionalParticleWidth(2)
  .linkDirectionalParticleColor((l) => ET[l.type].color.replace(/[\d.]+\)$/, '1)'))
  .nodeCanvasObject(drawNode)
  .nodePointerAreaPaint((o, color, ctx) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(o.x, o.y, radius(o) + 2, 0, 2 * Math.PI); ctx.fill(); })
  .onNodeHover((o) => { st.hover = o ? o.id : null; if (!dragging) el.style.cursor = o ? 'grab' : 'default'; })
  .onNodeClick((o) => select(o.id, { zoom: false }))
  // Drag: the simulation stays hot while dragging, so neighbors follow and the graph
  // rearranges around the node; on drop the node stays where it was put (↻ releases all).
  .enableNodeDrag(true)
  .onNodeDrag((o) => { if (!dragging) { dragging = true; el.style.cursor = 'grabbing'; st.hover = o.id; } })
  .onNodeDragEnd((o) => { dragging = false; o.fx = o.x; o.fy = o.y; pinned.add(o.id); el.style.cursor = 'grab'; })
  .onBackgroundClick(() => select(null))
  .autoPauseRedraw(false)
  .warmupTicks(180) // lay out synchronously, so the first frame is already readable
  .cooldownTicks(200)
  .d3VelocityDecay(0.32);
let dragging = false;
const pinned = new Set();
function releaseAll() {
  for (const id of pinned) { const o = nodeObj.get(id); if (o) { o.fx = undefined; o.fy = undefined; } }
  pinned.clear();
  fg.d3ReheatSimulation();
}
fg.d3Force('charge').strength((o) => (o.n.type === 'layer' ? -420 : o.n.type === 'file' ? -200 : o.n.type === 'section' || o.n.type === 'note' ? -45 : -90));
fg.d3Force('link').distance((l) => (l.type === 'contains' ? 34 : l.type === 'links' ? 50 : 80)).strength((l) => (l.type === 'contains' ? 0.8 : 0.18));
// Weak gravity so loose nodes (an issue cited once, an orphan proof) stay in frame.
fg.d3Force('gravity', (() => { let nodes = []; const f = (alpha) => { for (const n of nodes) { n.vx -= n.x * 0.008 * alpha; n.vy -= n.y * 0.008 * alpha; } }; f.initialize = (ns) => { nodes = ns; }; return f; })());

function radius(o) {
  const t = NT[o.n.type];
  return t.r + Math.min(7, Math.sqrt(o.deg) * (o.n.type === 'section' || o.n.type === 'note' ? 0.6 : 0.9));
}
function isFocus(id) {
  const f = st.hover || st.selected;
  if (!f) return null;
  return id === f || (adj.get(f) && adj.get(f).has(id));
}
function isFocusLink(l) {
  const f = st.hover || st.selected;
  return !!f && (idOf(l.source) === f || idOf(l.target) === f);
}
function linkColor(l) {
  const base = ET[l.type].color;
  const f = st.hover || st.selected;
  if (f) return isFocusLink(l) ? base.replace(/[\d.]+\)$/, '0.9)') : 'rgba(42,22,49,.04)';
  if (st.lens !== 'none' && !lensLink(l)) return 'rgba(42,22,49,.03)';
  return base;
}
function nodeColor(n) {
  if (n.type === 'file' && n.status !== 'filled') return TEMPLATE_COLOR;
  if (n.type === 'proof' && !n.defined) return UNDEFINED_PROOF;
  return NT[n.type].color;
}
function drawNode(o, ctx, scale) {
  const n = o.n;
  const r = radius(o);
  const focus = isFocus(o.id);
  const dim = (focus === false) || (focus === null && st.lens !== 'none' && !lensNode(o));
  ctx.globalAlpha = dim ? 0.15 : 1;
  const color = nodeColor(n);
  const hollow = n.type === 'file' && n.status !== 'filled';
  ctx.beginPath();
  ctx.arc(o.x, o.y, r, 0, 2 * Math.PI);
  ctx.fillStyle = hollow ? '#FFFFFF' : color;
  ctx.fill();
  if (hollow) { ctx.setLineDash([2 / scale, 2 / scale]); ctx.strokeStyle = color; ctx.lineWidth = 1.4 / Math.max(scale, 0.6); ctx.stroke(); ctx.setLineDash([]); }
  else { ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1 / Math.max(scale, 0.6); ctx.stroke(); }
  if (n.drift) { ctx.beginPath(); ctx.arc(o.x, o.y, r + 3, 0, 2 * Math.PI); ctx.strokeStyle = '#DC2626'; ctx.lineWidth = 1.5 / scale; ctx.stroke(); }
  if (o.id === st.selected) { ctx.beginPath(); ctx.arc(o.x, o.y, r + 3.5, 0, 2 * Math.PI); ctx.strokeStyle = '#7C3AED'; ctx.lineWidth = 2 / scale; ctx.stroke(); }
  if (pinned.has(o.id)) { ctx.beginPath(); ctx.arc(o.x, o.y, Math.max(1, r * 0.28), 0, 2 * Math.PI); ctx.fillStyle = '#FFFFFF'; ctx.fill(); }

  const always = ['layer', 'persona', 'offer'].includes(n.type) || (n.type === 'file' && n.status === 'filled') || (n.type === 'source' && o.deg > 6);
  const quiet = n.type === 'note' || n.type === 'section' || n.type === 'intro' || n.type === 'issue';
  const show = focus === true || (focus === null && (always || (quiet ? scale > 4 || (n.type === 'note' && n.hop === 0 && scale > 1.2) : scale > 2.4 || (scale > 1.4 && (o.deg > 5 || n.type === 'proof')))));
  if (show && !dim) {
    const label = shortLabel(n);
    const fs = Math.max(10 / scale, n.type === 'layer' ? 4.2 : 3);
    ctx.font = `${n.type === 'layer' || n.type === 'persona' || n.type === 'offer' ? 600 : 500} ${fs}px Outfit, system-ui, sans-serif`;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    // White halo keeps labels readable over edges.
    ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 3 / scale;
    ctx.strokeText(label, o.x + r + 3, o.y);
    ctx.fillStyle = hollow ? '#8A8090' : '#24142A';
    ctx.fillText(label, o.x + r + 3, o.y);
  }
  ctx.globalAlpha = 1;
}
function roundRect(ctx, x, y, w, h, r) { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function shortLabel(n) {
  let s = n.type === 'proof' ? n.label + (n.title && n.title !== n.label ? ' · ' + n.title : '') : n.label;
  s = s.replace(/^(Primary|Secondary|Hypothesis) Persona:\s*/i, '').replace(/^Offer \d+:\s*/i, '').replace(/^Deal:\s*/, '').replace(/^Alternativa:\s*/, '');
  return s.length > 44 ? s.slice(0, 42) + '…' : s;
}

// ---------------------------------------------------------------- render
let viewKey = ''
function refresh() {
  // Only hand new data to the simulation when the shape changed; selection alone just redraws.
  const key = JSON.stringify([st.mode, [...st.hiddenTypes].sort(), [...st.hiddenEdges].sort()]);
  if (key !== viewKey) { viewKey = key; buildView(); fg.graphData(view); }
  computeLens();
  renderBar(); renderLegend(); renderTree(); renderDetail();
  persist();
}
function renderBar() {
  for (const b of document.querySelectorAll('#mode button')) b.classList.toggle('on', b.dataset.v === st.mode);
  for (const b of document.querySelectorAll('#lens button')) b.classList.toggle('on', b.dataset.v === st.lens);
  const present = new Set(GRAPH.edges.map((e) => e.type));
  const counts = view.links.reduce((m, l) => ((m[l.type] = (m[l.type] || 0) + 1), m), {});
  document.getElementById('echips').innerHTML = Object.entries(ET).filter(([k]) => present.has(k)).map(([k, v]) =>
    `<span class="chip ${st.hiddenEdges.has(k) ? 'off' : ''}" data-e="${k}"><span class="sw ${v.dash ? 'dash' : ''}" style="background:${v.color.replace(/[\d.]+\)$/, '1)')};color:${v.color.replace(/[\d.]+\)$/, '1)')}"></span>${v.label}${counts[k] ? ` <span style="color:var(--faint);font:10px var(--mono)">${counts[k]}</span>` : ''}</span>`).join('');
}
function renderLegend() {
  const present = new Set(GRAPH.nodes.map((n) => n.type));
  document.getElementById('legend').innerHTML = Object.entries(NT).filter(([k]) => present.has(k)).map(([k, v]) =>
    `<span class="li ${st.hiddenTypes.has(k) ? 'off' : ''}" data-t="${k}">${dotHtml(k)}${v.label}</span>`).join('');
}
function dotHtml(type, n) {
  const color = n ? nodeColor(n) : NT[type].color;
  const hollow = n && type === 'file' && n.status !== 'filled';
  return `<span class="dot ${hollow ? 'hollow' : ''}" style="background:${color};border-color:${color}"></span>`;
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function renderTree() {
  const tree = document.getElementById('tree');
  const q = st.q.trim().toLowerCase();
  const row = (n, extra = '', meta = '') => `<div class="row ${extra} ${n.id === st.selected ? 'sel' : ''}" data-id="${esc(n.id)}" title="${esc(n.title || n.label)}">${dotHtml(n.type, n)}<span class="t">${esc(shortLabel(n))}</span><span class="m">${meta}</span></div>`;
  if (q) {
    const hits = GRAPH.nodes.filter((n) => [n.label, n.title, n.path, n.excerpt, n.obsidian].some((v) => v && String(v).toLowerCase().includes(q)))
      .sort((a, b) => (b.label.toLowerCase().includes(q) - a.label.toLowerCase().includes(q)) || (b.degree - a.degree)).slice(0, 80);
    tree.innerHTML = `<div class="grp"><div class="gh">Resultados<span class="n">${hits.length}</span></div><div class="items">${hits.map((n) => row(n, '', NT[n.type].label.toLowerCase())).join('') || '<div class="empty">Nada encontrado.</div>'}</div></div>`;
    return;
  }
  const groups = [];
  // Layers → files
  const layers = GRAPH.nodes.filter((n) => n.type === 'layer').sort((a, b) => a.label.localeCompare(b.label));
  let html = '';
  for (const l of layers) {
    const files = GRAPH.nodes.filter((n) => n.type === 'file' && n.path.startsWith(l.label + '/'));
    const filled = files.filter((f) => f.status === 'filled').length;
    html += row(l, '', `${filled}/${files.length}`);
    for (const f of files.sort((a, b) => a.path.localeCompare(b.path))) html += row(f, 'indent' + (f.status === 'filled' ? '' : ' dim'), f.drift ? '⚠' : (f.status === 'filled' ? '' : STATUS_LABEL[f.status]));
  }
  groups.push(['Camadas · arquivos', html, layers.length, false]);
  const ent = (type, title, sort, limit, closed) => {
    let ns = GRAPH.nodes.filter((n) => n.type === type);
    ns.sort(sort || ((a, b) => b.degree - a.degree));
    const total = ns.length;
    if (limit) ns = ns.slice(0, limit);
    if (total) groups.push([title, ns.map((n) => row(n, '', type === 'proof' ? (n.defined ? n.degree : 'sem def.') : n.degree)).join(''), total, closed]);
  };
  ent('persona', 'Personas', (a, b) => a.line - b.line);
  ent('offer', 'Ofertas', (a, b) => a.line - b.line);
  ent('proof', 'Provas', (a, b) => a.label.localeCompare(b.label, 'en', { numeric: true }));
  ent('source', 'Fontes', null);
  ent('deal', 'Deals (win/loss)', (a, b) => a.line - b.line, 0, true);
  ent('alternative', 'Alternativas (concorrência)', (a, b) => a.line - b.line, 0, true);
  ent('issue', 'Issues Linear (top 20)', null, 20, true);
  if (hasVault) ent('note', 'Notas Obsidian (top 30)', null, 30, true);
  tree.innerHTML = groups.map(([t, h, n, closed]) => `<div class="grp ${closed ? 'closed' : ''}"><div class="gh">${closed ? '▸' : '▾'} ${esc(t)}<span class="n">${n}</span></div><div class="items">${h}</div></div>`).join('');
}

function openLinks(n) {
  const out = [];
  const m = GRAPH.meta;
  const vaultRoot = m.vault && m.vault.root;
  const vaultName = vaultRoot ? vaultRoot.split('/').filter(Boolean).pop() : 'obsidian-vault';
  if (n.path && n.type !== 'note' && n.type !== 'layer' && n.type !== 'issue') out.push(`<a href="vscode://file/${encodeURI(m.root + '/' + n.path)}${n.line ? ':' + n.line : ''}">Abrir no VS Code</a>`);
  if (n.type === 'note') out.push(`<a href="obsidian://open?vault=${encodeURIComponent(vaultName)}&file=${encodeURIComponent(n.path.replace(/\.md$/, ''))}">Abrir no Obsidian</a>`);
  if (n.obsidian) out.push(`<a href="obsidian://open?vault=${encodeURIComponent(vaultName)}&file=${encodeURIComponent((n.notePath || n.obsidian).replace(/\.md$/, ''))}">Abrir fonte no Obsidian</a>`);
  if (n.url) out.push(`<a href="${esc(n.url)}" target="_blank" rel="noopener">Abrir no Linear</a>`);
  if (n.path) out.push(`<button data-copy="${esc(n.type === 'note' ? (vaultRoot + '/' + n.path) : (m.root + '/' + n.path))}">Copiar caminho</button>`);
  return out.join('');
}
function renderDetail() {
  const box = document.getElementById('detail');
  const wrap = document.getElementById('dwrap');
  if (!st.selected || !byId.has(st.selected)) { box.classList.remove('open'); return; }
  box.classList.add('open');
  const n = byId.get(st.selected);
  const pills = [];
  if (n.status) pills.push(`<span class="pill ${n.status === 'filled' ? 'ok' : 'warn'}">${esc(STATUS_LABEL[n.status] || n.status)}</span>`);
  if (n.drift) pills.push(`<span class="pill bad">drift: ${esc(n.drift)}</span>`);
  if (n.type === 'proof') pills.push(`<span class="pill ${n.defined ? 'ok' : 'bad'}">${n.defined ? esc(n.kind) : 'citada sem definição'}</span>`);
  if (n.tier) pills.push(`<span class="pill">${esc(n.tier)}</span>`);
  if (n.outcome) pills.push(`<span class="pill">${esc(n.outcome)}</span>`);
  if (n.seals) for (const [k, v] of Object.entries(n.seals)) pills.push(`<span class="pill ${k === 'COMPROVADO' || k === 'LITERAL' ? 'ok' : k === 'HIPÓTESE' || k === 'PROPOSTA' ? 'warn' : ''}">${esc(k)} ×${v}</span>`);
  if (n.tags) for (const t of n.tags) pills.push(`<span class="pill">#${esc(t)}</span>`);
  const kv = [];
  if (n.path) kv.push([n.type === 'source' || n.type === 'proof' ? 'definida em' : 'caminho', esc(n.path) + (n.line ? ':' + n.line : '')]);
  if (n.title && n.title !== n.label) kv.push(['título', esc(n.title)]);
  if (n.updated) kv.push(['atualizado', esc(n.updated)]);
  if (n.obsidian) kv.push(['obsidian', esc(n.obsidian)]);
  if (n.desc) kv.push(['descrição', esc(n.desc)]);
  if (n.noteType) kv.push(['type', esc(n.noteType)]);
  if (n.hop !== undefined) kv.push(['distância', n.hop === 0 ? 'semente (citada pelo brand)' : `${n.hop} salto(s) das fontes`]);
  if (n.backlinks !== undefined) kv.push(['backlinks', n.backlinks]);
  if (n.placeholders) kv.push(['placeholders', n.placeholders]);
  if (n.rows) kv.push(['BRAND-BRAIN', n.rows.map((r) => `${esc(r.layer)}: ${esc(r.status)}${r.fallback ? ' · provisório: ' + esc(r.fallback) : ''}`).join('<br>')]);
  kv.push(['grau', n.degree]);

  // connections from the current (possibly collapsed) view
  const groups = new Map();
  for (const l of view.links) {
    const s = idOf(l.source), t = idOf(l.target);
    if (s !== n.id && t !== n.id) continue;
    const other = s === n.id ? t : s;
    const dir = s === n.id ? 'out' : 'in';
    const key = l.type + ':' + dir;
    (groups.get(key) || groups.set(key, []).get(key)).push({ l, other });
  }
  const dirLabel = { out: '→', in: '←' };
  const order = ['tension', 'pending', 'loads', 'cites', 'proves', 'mentions', 'defines', 'derives', 'resolves', 'links', 'tracks', 'contains'];
  const conn = [...groups].sort((a, b) => order.indexOf(a[0].split(':')[0]) - order.indexOf(b[0].split(':')[0])).map(([key, items]) => {
    const [type, dir] = key.split(':');
    items.sort((a, b) => b.l.weight - a.l.weight);
    return `<div class="cgrp"><h4><span class="chip" style="padding:0 6px;border:0;background:none"><span class="sw ${ET[type].dash ? 'dash' : ''}" style="background:${ET[type].color.replace(/[\d.]+\)$/, '1)')};color:${ET[type].color.replace(/[\d.]+\)$/, '1)')}"></span></span>${dirLabel[dir]} ${esc(ET[type].label)} · ${items.length}</h4>` +
      items.slice(0, 40).map(({ l, other }) => {
        const o = byId.get(other);
        const ev = (l.evidence || [])[0];
        const evText = ev ? (ev.alias ? `“${ev.alias}”: ` : '') + (ev.text || '') + (ev.file && ev.line ? ` (${ev.file.split('/').pop()}:${ev.line})` : '') : '';
        return `<div class="crow" data-id="${esc(other)}">${dotHtml(o.type, o)}<span class="ct">${esc(o.type === 'section' || o.type === 'intro' ? o.path.split('/').pop() + ' › ' + o.label : shortLabel(o))}</span><span class="w">${l.step ? '#' + l.step : l.weight > 1 ? '×' + l.weight : ''}</span>${evText ? `<div class="ev">${esc(evText.slice(0, 180))}</div>` : ''}</div>`;
      }).join('') + (items.length > 40 ? `<div class="empty">+${items.length - 40}</div>` : '') + '</div>';
  }).join('');

  wrap.innerHTML = `
    <div class="crumb">${dotHtml(n.type, n)}<span>${esc(NT[n.type].label)}${n.path && n.type !== 'file' ? ' · ' + esc(n.path.split('/').slice(0, -1).join('/') || n.path) : ''}</span><button id="dclose" title="Fechar (Esc)">×</button></div>
    <div class="dtitle">${esc(n.type === 'proof' ? n.label : n.label)}</div>
    ${n.type === 'proof' && n.title ? `<div class="dsub">${esc(n.title)}</div>` : ''}
    <div style="margin-top:8px">${pills.join('')}</div>
    <div class="acts">${openLinks(n)}</div>
    <dl class="kv">${kv.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    ${n.excerpt ? `<div class="excerpt">${esc(n.excerpt)}${n.excerpt.length >= 600 ? '…' : ''}</div>` : ''}
    ${conn || '<div class="empty">Sem conexões visíveis com os filtros atuais.</div>'}`;
}

// ---------------------------------------------------------------- actions
function select(id, { zoom = true } = {}) {
  st.selected = id;
  if (id) {
    const n = byId.get(id);
    // Make sure the node is visible: switch granularity / unhide its type.
    if (n && SECTIONISH.has(n.type) && parentOf(n) !== n.id) st.mode = TYPED.has(n.type) ? 'entities' : 'sections';
    if (n && st.hiddenTypes.has(n.type)) st.hiddenTypes.delete(n.type);
    history.replaceState(null, '', '#n=' + encodeURIComponent(id));
  } else history.replaceState(null, '', location.pathname);
  refresh();
  if (id && zoom) setTimeout(() => { const o = nodeObj.get(id); if (o && o.x !== undefined) { fg.centerAt(o.x, o.y, 500); fg.zoom(Math.max(fg.zoom(), 2.2), 500); } }, 60);
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 1600); }

document.getElementById('mode').onclick = (e) => { const v = e.target.dataset.v; if (!v) return; st.mode = v; if (v === 'sections') st.hiddenTypes.delete('section'); refresh(); };
document.getElementById('lens').onclick = (e) => { const v = e.target.dataset.v; if (!v) return; st.lens = v; if (v === 'tension') st.hiddenEdges.delete('tension'); if (v === 'pending') st.hiddenEdges.delete('pending'); if (v === 'proof') { st.hiddenEdges.delete('proves'); st.hiddenEdges.delete('mentions'); } if (v === 'sources') { st.hiddenEdges.delete('derives'); st.hiddenEdges.delete('resolves'); } refresh(); };
document.getElementById('echips').onclick = (e) => { const c = e.target.closest('[data-e]'); if (!c) return; const k = c.dataset.e; st.hiddenEdges.has(k) ? st.hiddenEdges.delete(k) : st.hiddenEdges.add(k); refresh(); };
document.getElementById('legend').onclick = (e) => { const c = e.target.closest('[data-t]'); if (!c) return; const k = c.dataset.t; st.hiddenTypes.has(k) ? st.hiddenTypes.delete(k) : st.hiddenTypes.add(k); if (k === 'section' && !st.hiddenTypes.has(k)) st.mode = 'sections'; refresh(); };
document.getElementById('tree').onclick = (e) => {
  const gh = e.target.closest('.gh'); if (gh) { gh.parentElement.classList.toggle('closed'); gh.firstChild.textContent = gh.parentElement.classList.contains('closed') ? '▸ ' : '▾ '; return; }
  const r = e.target.closest('[data-id]'); if (r) select(r.dataset.id);
};
document.getElementById('dwrap').onclick = (e) => {
  if (e.target.id === 'dclose') return select(null);
  const c = e.target.closest('[data-copy]'); if (c) { navigator.clipboard && navigator.clipboard.writeText(c.dataset.copy).then(() => toast('Caminho copiado')); return; }
  const r = e.target.closest('[data-id]'); if (r) select(r.dataset.id);
};
const q = document.getElementById('q');
q.oninput = () => { st.q = q.value; renderTree(); };
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
  else if (e.key === 'Escape') { if (document.activeElement === q && q.value) { q.value = ''; st.q = ''; renderTree(); } else { q.blur(); select(null); } }
});
document.getElementById('zin').onclick = () => fg.zoom(fg.zoom() * 1.4, 250);
document.getElementById('zout').onclick = () => fg.zoom(fg.zoom() / 1.4, 250);
document.getElementById('zfit').onclick = () => fg.zoomToFit(400, 40);
document.getElementById('zre').onclick = () => { releaseAll(); toast('Layout reorganizado'); };
new ResizeObserver(() => fg.width(el.clientWidth).height(el.clientHeight)).observe(el);

// ---------------------------------------------------------------- boot
const m = GRAPH.meta;
document.getElementById('sub').textContent = [m.brand, m.vault ? 'brand + Obsidian' : 'brand'].filter(Boolean).join(' · ');
const fileNodes = GRAPH.nodes.filter((n) => n.type === 'file');
document.getElementById('foot').innerHTML = `${GRAPH.nodes.length} nós · ${GRAPH.edges.length} arestas<br>${fileNodes.filter((f) => f.status === 'filled').length}/${fileNodes.length} arquivos preenchidos${m.vault ? `<br>vault: ${m.vault.kept}/${m.vault.notesTotal} notas, ${m.bridges} pontes` : ''}<br>gerado ${esc((m.generatedAt || '').slice(0, 16).replace('T', ' '))}`;
const fromHash = decodeURIComponent((location.hash.match(/n=([^&]+)/) || [])[1] || '');
if (fromHash && byId.has(fromHash)) st.selected = fromHash;
refresh();
let fitted = false;
const fitOnce = () => {
  if (fitted) return;
  fitted = true;
  const o = st.selected && nodeObj.get(st.selected);
  if (o) { fg.centerAt(o.x, o.y, 400); fg.zoom(2.4, 400); } else fg.zoomToFit(500, 50);
};
fg.onEngineStop(fitOnce);
setTimeout(fitOnce, 2500);
</script>
</body>
